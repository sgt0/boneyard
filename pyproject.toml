[project]
name = "boneyard"
version = "0.3.0"
description = ""
license = "MIT"
readme = "README.md"
authors = [
    { name = "sgt0", email = "140186177+sgt0@users.noreply.github.com" }
]
classifiers = [
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "ass~=1.0.3",
    "jetpytools~=3.1.0",
    "muxtools~=0.4.2",
    "pydantic~=2.13.4",
    "vapoursynth>=77",
    "vapoursynth-cambi~=1.2.0",
    "vapoursynth-scxvid~=3.0",
    "vsjetpack~=2.2.0",

    # Explicitly specify these so they're properly resolved through `uv --index`.
    "vapoursynth-fmtconv>=31.1",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "ruff==0.16.2",
]

[build-system]
requires = ["uv_build==0.12.2"]
build-backend = "uv_build"

[tool.uv.sources]
vapoursynth-fmtconv = { index = "vs-wheels" }

[[tool.uv.index]]
name = "vs-wheels"
url = "https://jaded-encoding-thaumaturgy.github.io/vs-wheels/simple"
explicit = true

[tool.basedpyright]
stubPath = "stubs"

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/stubs"
exclude_gitignore = true
exclude = ["^submodules/"]

# Flags changed by --strict
warn_return_any = false
extra_checks = false

# Misc
warn_unreachable = true

enable_error_code = ["explicit-override"]
allow_redefinition_new = true
local_partial_types = true
implicit_reexport = false
strict = true

show_column_numbers = true
pretty = true
color_output = true
error_summary = true

[[tool.mypy.overrides]]
module = "vapoursynth.*"
ignore_errors = true
